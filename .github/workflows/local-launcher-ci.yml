name: Local Launcher CI

on:
  pull_request:
    paths:
      - "run.py"
      - "run.bat"
      - "setup.bat"
      - "tests/test_local_launchers.py"
      - ".github/workflows/local-launcher-ci.yml"
  push:
    branches:
      - "master"
    paths:
      - "run.py"
      - "run.bat"
      - "setup.bat"
      - "tests/test_local_launchers.py"
      - ".github/workflows/local-launcher-ci.yml"

permissions:
  contents: read

jobs:
  launcher-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launcher contract tests
        run: python -m pytest -q tests/test_local_launchers.py
