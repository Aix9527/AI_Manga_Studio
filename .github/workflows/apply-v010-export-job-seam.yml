name: Apply v0.10 export job seam

on:
  push:
    branches:
      - "feat/v0.10-timeline-nle-persistence"
    paths:
      - ".github/workflows/apply-v010-export-job-seam.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.10-timeline-nle-persistence
          fetch-depth: 0
      - name: Patch JobSettings and JobService
        run: |
          python - <<'PY'
          from pathlib import Path

          schemas = Path("backend/orchestration/schemas.py")
          text = schemas.read_text(encoding="utf-8")
          old = '    template: dict[str, Any] = Field(default_factory=dict)\n\n    @model_validator(mode="after")'
          new = '    template: dict[str, Any] = Field(default_factory=dict)\n    timeline: dict[str, Any] = Field(default_factory=dict)\n\n    @model_validator(mode="after")'
          if text.count(old) != 1:
              raise SystemExit(f"JobSettings insertion point count={text.count(old)}")
          schemas.write_text(text.replace(old, new, 1), encoding="utf-8")

          service = Path("backend/orchestration/service.py")
          text = service.read_text(encoding="utf-8")
          old = '''        self.broadcaster.broadcast(job_id, "job_created", {"job_id": job_id, "status": JobStatus.QUEUED})\n        return self._build_detail(job_id)\n\n    def get_job(self, job_id: str) -> JobDetail | None:\n'''
          new = '''        self.broadcaster.broadcast(job_id, "job_created", {"job_id": job_id, "status": JobStatus.QUEUED})\n        return self._build_detail(job_id)\n\n    def create_timeline_export(self, data: JobCreate, *, timeline: dict[str, Any]) -> JobDetail:\n        existing = self.repo.get_idempotent(data.idempotency_key)\n        if existing:\n            return self._build_detail(existing["id"])\n        settings = JobSettings(\n            width=data.width,\n            height=data.height,\n            fps=data.fps,\n            shot_duration=data.shot_duration,\n            options=JobOptions(**data.options) if data.options else JobOptions(),\n            timeline=dict(timeline),\n        )\n        job_id = self.repo.create_job(data, settings)\n        self.repo.create_steps(job_id, [\n            {"stage_key": "composition_compose", "shot_id": ""},\n            {"stage_key": "export", "shot_id": ""},\n        ])\n        self.repo.set_job_status(job_id, JobStatus.QUEUED, allowed_from={JobStatus.DRAFT})\n        self.broadcaster.broadcast(\n            job_id, "job_created",\n            {"job_id": job_id, "status": JobStatus.QUEUED, "source": "timeline_snapshot"},\n        )\n        return self._build_detail(job_id)\n\n    def get_job(self, job_id: str) -> JobDetail | None:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"JobService insertion point count={text.count(old)}")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit exact seams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/orchestration/schemas.py backend/orchestration/service.py
          git commit -m "feat(timeline): add compose export only job profile"
          git push origin HEAD:feat/v0.10-timeline-nle-persistence
