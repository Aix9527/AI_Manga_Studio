name: Persist Verified Frontend Dependencies

on:
  push:
    branches:
      - "feat/unified-local-studio"
    paths:
      - ".github/workflows/dependency-upgrade-probe.yml"

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    env:
      AI_MANGA_NOVEL_VIDEO_CAPABILITY: ci-local-capability
      AI_MANGA_NOVEL_PROXY_SECRET: ci-local-proxy-secret
      AI_MANGA_BACKEND_URL: http://127.0.0.1:8000
      AI_MANGA_VITE_PORT: "5173"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate verified dependency set
        run: |
          npm install react-router-dom@7.18.0
          npm install --save-dev vite@8.2.2 vitest@4.1.11 @vitejs/plugin-react@6.1.0
          npm audit fix
          npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit verified manifests
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes to persist."
            exit 0
          fi
          git commit -m "build: upgrade frontend dependencies"
          git push origin HEAD:feat/unified-local-studio
