name: H3 Unified Backend CI

on:
  pull_request:
    paths:
      - "backend/video/h3_unified/**"
      - "backend/video/providers/minimax_h3_unified_provider.py"
      - "backend/novel_video/h3_provider.py"
      - "backend/novel_video/h3_unified_runtime.py"
      - "backend/novel_video/runner.py"
      - "backend/orchestration/worker.py"
      - "backend/main.py"
      - "backend/production/comfy_adapter.py"
      - "backend/core/runtime/router.py"
      - "backend/api/runtime_api.py"
      - "tools/h3_unified_live_gate.py"
      - "tests/video/test_h3_unified*.py"
      - "requirements.txt"
      - ".github/workflows/h3-backend-ci.yml"
  push:
    branches:
      - "master"
    paths:
      - "backend/video/h3_unified/**"
      - "backend/video/providers/minimax_h3_unified_provider.py"
      - "backend/novel_video/h3_provider.py"
      - "backend/novel_video/h3_unified_runtime.py"
      - "backend/novel_video/runner.py"
      - "backend/orchestration/worker.py"
      - "backend/main.py"
      - "backend/production/comfy_adapter.py"
      - "backend/core/runtime/router.py"
      - "backend/api/runtime_api.py"
      - "tools/h3_unified_live_gate.py"
      - "tests/video/test_h3_unified*.py"
      - "requirements.txt"
      - ".github/workflows/h3-backend-ci.yml"

permissions:
  contents: write

jobs:
  h3-unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: H3 production wiring syntax
        run: python -m py_compile backend/main.py backend/novel_video/h3_unified_runtime.py backend/video/h3_unified/formal_provider.py backend/video/h3_unified/live_gate.py tools/h3_unified_live_gate.py
      - name: H3 unified tests
        run: pytest -q tests/video/test_h3_unified.py tests/video/test_h3_unified_router.py tests/video/test_h3_unified_execution.py tests/video/test_h3_unified_formal.py tests/video/test_h3_unified_factory.py tests/video/test_h3_unified_formal_assets.py tests/video/test_h3_unified_provider_media_binding.py tests/video/test_h3_unified_live_gate.py --disable-warnings --maxfail=1

  apply-timeline-runtime:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/v0.10-timeline-nle-persistence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.10-timeline-nle-persistence
          fetch-depth: 0
      - name: Apply exact patch script
        run: python tools/apply_v010_timeline_runtime_patch.py
      - name: Commit runtime patch
        run: |
          if git diff --quiet -- backend/video/composer.py backend/orchestration/worker.py; then
            echo "Runtime patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/video/composer.py backend/orchestration/worker.py
          git commit -m "feat(timeline): render canonical snapshot compositions"
          git push origin HEAD:feat/v0.10-timeline-nle-persistence
