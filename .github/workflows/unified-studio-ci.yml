name: Unified Studio CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/workspace/**"
      - "backend/orchestration/**"
      - "backend/routes/jobs.py"
      - "tests/workspace/**"
      - "tests/orchestration/**"
      - "requirements.txt"
      - ".github/workflows/unified-studio-ci.yml"
  push:
    branches:
      - "master"
    paths:
      - "frontend/**"
      - "backend/workspace/**"
      - "backend/orchestration/**"
      - "backend/routes/jobs.py"
      - "tests/workspace/**"
      - "tests/orchestration/**"
      - "requirements.txt"
      - ".github/workflows/unified-studio-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      AI_MANGA_NOVEL_VIDEO_CAPABILITY: ci-local-capability
      AI_MANGA_NOVEL_PROXY_SECRET: ci-local-proxy-secret
      AI_MANGA_BACKEND_URL: http://127.0.0.1:8000
      AI_MANGA_VITE_PORT: "5173"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  workspace-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Workspace syntax
        run: python -m py_compile backend/workspace/models.py backend/workspace/repository.py backend/workspace/template_compiler.py backend/workspace/template_service.py backend/workspace/service.py backend/workspace/routes.py backend/orchestration/database.py backend/orchestration/schemas.py backend/orchestration/repository.py backend/orchestration/service.py backend/orchestration/template_resolution.py backend/orchestration/template_provider_policy.py backend/orchestration/worker.py backend/routes/jobs.py
      - name: Workspace and orchestration contracts
        run: python -m pytest -q tests/workspace/test_project_assets.py tests/workspace/test_director_settings.py tests/workspace/test_director_runtime_binding.py tests/workspace/test_production_template_repository.py tests/workspace/test_production_template_compiler.py tests/workspace/test_production_template_routes.py tests/orchestration/test_project_template_job_resolution.py tests/orchestration/test_template_provider_runtime.py tests/orchestration/test_stage_execution.py tests/orchestration/test_stage_execution_routes.py tests/orchestration/test_stage_execution_job_reset.py --disable-warnings --maxfail=1
