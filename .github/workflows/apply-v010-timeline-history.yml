name: Apply v0.10 Timeline History

on:
  push:
    branches:
      - feat/v0.10-timeline-nle-persistence
    paths:
      - .github/workflows/apply-v010-timeline-history.yml

permissions:
  contents: write

jobs:
  patch-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.10-timeline-nle-persistence
      - name: Apply patch
        run: python scripts/apply_v010_timeline_history.py
      - name: Verify syntax
        run: python -m py_compile backend/timeline/models.py backend/timeline/service.py backend/timeline/routes.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/timeline/service.py backend/timeline/routes.py
          git diff --cached --check
          git commit -m "feat(timeline): persist undo redo history"
          git push origin HEAD:feat/v0.10-timeline-nle-persistence
