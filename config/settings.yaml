# ============================================================
# AI Manga Studio Pro V1.0 — Global Configuration
# ============================================================

runtime:
  data_root: "."
  local_only: true

orchestration:
  database_path: "database/orchestration.db"
  worker_poll_seconds: 0.5
  lease_seconds: 30
  heartbeat_seconds: 10
  max_retries: 3
  retry_delays_seconds: [5, 15, 45]

project:
  name: "AI Manga Studio Pro"
  version: "1.0.0"
  dir: "D:\\AI_Manga_Studio"
  output_dir: "D:\\AI_Manga_Studio\\storage\\output"
  cache_dir: "D:\\AI_Manga_Studio\\cache"

server:
  host: "127.0.0.1"
  port: 8800
  reload: true
  log_level: "info"
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

# ============================================================
# Multi-GPU ComfyUI Instances
#
# Architecture:
#   GPU 0 → Flux (image generation)
#   GPU 1 → Wan  (video generation)
#   GPU 2 → LTX  (video generation)
#
# ComfyUI launch commands (run separately):
#   set CUDA_VISIBLE_DEVICES=0 && python main.py --port 8188
#   set CUDA_VISIBLE_DEVICES=1 && python main.py --port 8189
#   set CUDA_VISIBLE_DEVICES=2 && python main.py --port 8190
# ============================================================
comfyui:
  url: "http://127.0.0.1:8188"
  output_dir: "F:\\Comfy-Desktop\\ComfyUI-Shared\\output"
  timeout: 600
  poll_interval: 2.0
  max_concurrent: 2

  instances:
    flux:
      gpu_id: 0
      port: 8188
      base_url: "http://127.0.0.1:8188"
    wan:
      gpu_id: 0
      port: 8188
      base_url: "http://127.0.0.1:8188"
    ltx:
      gpu_id: 0
      port: 8188
      base_url: "http://127.0.0.1:8188"

database:
  type: "sqlite"
  base_dir: "D:\\AI_Manga_Studio\\database"
  databases:
    characters: "D:\\AI_Manga_Studio\\database\\characters.db"
    scenes:     "D:\\AI_Manga_Studio\\database\\scenes.db"
    projects:   "D:\\AI_Manga_Studio\\database\\projects.db"
    tasks:      "D:\\AI_Manga_Studio\\database\\tasks.db"
    cache:      "D:\\AI_Manga_Studio\\database\\cache.db"
  redis_url: "redis://127.0.0.1:6379/0"

generation:
  default_style: "realistic"
  default_resolution: [3840, 2160]
  styles:
    - anime
    - manga
    - realistic
    - semi-realistic
  image:
    width: 3840
    height: 2160
    steps: 30
    cfg_scale: 7.0
    sampler: "euler_ancestral"
    scheduler: "normal"
  video:
    fps: 8
    num_frames: 24
    motion_scale: 1.0
  upscale:
    factor: 4
    model: "4x_NMKD-Siax_200k"
  quality:
    enabled: true
    score_threshold: 0.7
    max_retries: 3

ai:
  character:
    seed_range: [1, 2147483647]
    default_loras: []
  scene:
    default_weather: "clear"
    default_lighting: "natural"
  camera:
    avoid_repeat: 3
  motion:
    dialogue_intensity: 0.3
    action_intensity: 0.8
  emotion:
    model: "deepface"
    expression_blend: true
  lipsync:
    engine: "cosyvoice"
    musetalk_enabled: true
    sample_rate: 22050

models:
  checkpoint: "models/checkpoints/"
  lora: "models/loras/"
  vae: "models/vae/"
  controlnet: "models/controlnet/"
  upscale: "models/upscale_models/"
  animatediff: "models/animatediff_models/"

paths:
  workflow: "D:\\AI_Manga_Studio\\workflow"
  cache: "D:\\AI_Manga_Studio\\storage\\cache"
  logs: "D:\\AI_Manga_Studio\\logs"
  plugins: "D:\\AI_Manga_Studio\\plugins"
  storage: "D:\\AI_Manga_Studio\\storage"
  scripts: "D:\\AI_Manga_Studio\\scripts"
  tests: "D:\\AI_Manga_Studio\\tests"
  docs: "D:\\AI_Manga_Studio\\docs"

# ============================================================
# Plugin Selection
# Each plugin is a self-contained directory under plugins/
# Switch any plugin by changing the name below
# ============================================================
plugins:
  image: "flux"        # Image gen: flux / sd / sdxl
  video: "wan"         # I2V: wan / ltx / animatediff
  tts: "tts"           # TTS: tts / bark / cosyvoice
  subtitle: "subtitle" # Subtitles: subtitle / ass / smart
  music: "music"       # Music: music / suno / udio
  quality: "quality"   # Enhancement: quality / realesrgan

# ============================================================
# Quality Engine
# Runs OUTSIDE ComfyUI. Failed shots are auto re-queued.
# ============================================================
quality_engine:
  enabled: true
  max_retries: 3
  score_threshold: 0.65
  checks:
    image_quality:
      enabled: true
      threshold: 0.55
    anatomy:
      enabled: true
      threshold: 0.50
    face_consistency:
      enabled: true
      threshold: 0.60
    character_presence:
      enabled: false      # off by default, requires CLIP
      threshold: 0.55
    scene_match:
      enabled: false      # off by default, requires CLIP
      threshold: 0.50

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level:<8} | {name}:{function}:{line} - {message}"
  rotation: "100 MB"
  retention: "30 days"
  file: "D:\\AI_Manga_Studio\\logs\\manga_studio.log"
